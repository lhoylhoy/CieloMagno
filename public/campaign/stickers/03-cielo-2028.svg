  <rect width="512" height="512" rx="56" fill="#090D16"/>
  <rect x="22" y="22" width="468" height="468" rx="40" fill="none" stroke="#F59E0B" stroke-opacity=".55" stroke-width="3"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#F43F5E" stroke-opacity=".45" stroke-width="20"/>
